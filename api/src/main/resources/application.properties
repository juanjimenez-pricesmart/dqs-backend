spring.config.import=optional:file:.env.local[.properties]

server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:mysql://${DB_HOSTNAME}:${DB_PORT:3306}/${DB_DATABASE}?useSSL=${DB_USE_SSL:true}&serverTimezone=${DB_TIMEZONE:America/Guatemala}&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ── Which tables the catalogs are read from ──────────────────────────────────
# Clubs, routes and tariffs, fiscal document types, payment methods and exchange
# rates exist twice for now: in the legacy application's tables, and in ours.
# This picks which CatalogSource implementation is live.
#
# false (default) reads the legacy ps_* tables, as always. true reads the
# QuoteCenter tables that migration_quotecenter_catalogs.sql creates. Both are
# in the same database, so switching is a restart, not a deployment, and
# reversible if something looks wrong.
quotecenter.catalogs.own-tables=${QC_OWN_CATALOGS:false}

dqs.base-url=${BASE_URL:http://localhost/html}
dqs.timeout=${DQS_TIMEOUT:15000}

oms.base-url=${BUSINESS}
oms.timeout=${OMS_TIMEOUT:30000}
# Business API host. Legacy DQS calls BUSINESS + /api/membership/validate/...,
# and the IDP client-credentials token is issued for that host, so this must
# point there too. It was wired to MEMBERSHIP_BASE_URL (membership-devel), for
# which the stage token is not valid: every membership and item lookup came
# back 401. Kept in versioned config rather than .env.local, which is not in
# the repository and so cannot be relied on to be correct on a fresh clone.
business.api.membership-url=${BUSINESS}

idp.base-url=${IDP}
idp.client-id=${CLIENT_ID}
idp.client-secret=${CLIENT_SECRET}

gosocket.base-url=${GOSOCKET_BASE_URL}
gosocket.account-code=${GOSOCKET_ACCOUNT_CODE}
gosocket.username=${GOSOCKET_USERNAME}
gosocket.password=${GOSOCKET_PASSWORD}
gosocket.country-id=${GOSOCKET_COUNTRY_ID}
gosocket.identification-type=${GOSOCKET_IDENTIFICATION_TYPE}

pricesmart.payments.base-url=${PAYMENT_SERVICE_BASE_URL}
pricesmart.payments.api-url=${PAYMENT_SERVICE_GATEWAY_URL}
pricesmart.payments.idp-token-url=${PAYMENT_SERVICE_IDP_URL}
pricesmart.payments.client-id=${PAYMENT_SERVICE_CLIENT_ID}
pricesmart.payments.client-secret=${PAYMENT_SERVICE_CLIENT_SECRET}
pricesmart.payments.callback-url=${PAYMENT_CALLBACK_URL:http://localhost:8081/api/v1/payments/callback}
pricesmart.payments.return-url=${PAYMENT_RETURN_URL:http://localhost:5173/payment-return}

okta.domain=${OKTA_DOMAIN:}
okta.client-id=${OKTA_CLIENT_ID:}
okta.client-secret=${OKTA_CLIENT_SECRET:}
okta.redirect-uri=${OKTA_REDIRECT_URI:}
okta.auth-server=${OKTA_AUTH_SERVER:}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

quotecenter.pilot.enabled=${QUOTECENTER_PILOT_ENABLED:true}
quotecenter.payment-link.enabled=${QUOTECENTER_PAYMENT_LINK_ENABLED:true}
quotecenter.fel.enabled=${QUOTECENTER_FEL_ENABLED:true}
quotecenter.delivery.enabled=${QUOTECENTER_DELIVERY_ENABLED:true}

logging.level.com.dqs.api=${DQS_LOG_LEVEL:INFO}
