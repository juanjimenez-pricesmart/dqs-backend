# Quotation PDF marketing footer.
#
# Legacy keeps these as billing_footer_part_one/two/three and
# billing_footer_delivery in application/language/english.json:318-321, and
# their voseo twins (_vo) in espanol.json:211-213. English has no real voseo
# wording — english.json:354-356 are untranslated placeholders — and it never
# needed any, since the only voseo countries, Costa Rica and Nicaragua, read in
# Spanish. So the voseo variants live in messages_es_CR and messages_es_NI, and
# this file has none.
#
# part2 continues the sentence part1 started, across the site link, so its
# leading punctuation and spacing are part of the string.
quote.footer.marketing.part1=For your convenience, please visit the site
quote.footer.marketing.part2=, where you can find and purchase products for your business with our usual guarantee and quality.
quote.footer.marketing.part3=Need help? Please get in contact with a Business Service executive at the Club.
quote.footer.marketing.delivery=Delivery availabilities depend on your delivery address or preferred club.

# Quotation email. Legacy's dear_customer / email_quote_message /
# email_quote_footer / quote_email_subject, except that the middle two are
# untranslated placeholders in both of its language files — english.json says
# "Email quote message" and espanol.json says "Piel del correo", a typo for
# "Pie". Real wording here; there was nothing to carry over.
quote.email.subject=PriceSmart :: Quote No.: {0}
quote.email.greeting=Dear customer,
quote.email.body=Attached is the quotation you requested. It is valid until the expiry date shown on the document.
quote.email.footer=This message was sent automatically. Please contact your Business Service executive at the Club with any questions.
